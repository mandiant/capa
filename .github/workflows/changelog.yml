name: changelog

on: # zizmor: ignore[dangerous-triggers]
  # We need pull_request_target instead of pull_request because a write
  # repository token is needed to add a review to a PR. DO NOT BUILD
  # OR RUN UNTRUSTED CODE FROM PRs IN THIS ACTION
  pull_request_target:
    types: [opened, edited, synchronize]

jobs:
  check_changelog:
    permissions:
      pull-requests: write
    # no need to check for dependency updates via dependabot
    # github.event.pull_request.user.login refers to PR author
    if: |
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot-preview[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NO_CHANGELOG: '[x] No CHANGELOG update needed'
    steps:
    - name: Check changelog updated
      id: changelog_updated
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        changelog=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
          --jq '.[] | select(.filename == "CHANGELOG.md" and .status != "removed") | .filename')
        [ -n "$changelog" ] || grep -qiF "$NO_CHANGELOG" <<< "$PR_BODY"
    - name: Reject pull request if no CHANGELOG update
      if: ${{ always() && steps.changelog_updated.outcome == 'failure' }}
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REJECT_BODY: "Please add bug fixes, new features, breaking changes and anything else you think is worthwhile mentioning to the `master (unreleased)` section of CHANGELOG.md. If no CHANGELOG update is needed add the following to the PR description: `${{ env.NO_CHANGELOG }}`"
      run: |
        existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
          --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "CHANGES_REQUESTED") | .id')
        if [ -z "$existing" ]; then
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f event="REQUEST_CHANGES" \
            -f body="$REJECT_BODY"
        fi
    - name: Dismiss previous review if CHANGELOG update
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DISMISS_BODY: "CHANGELOG updated or no update needed, thanks! :smile:"
      run: |
        review_ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
          --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "CHANGES_REQUESTED") | .id')
        for id in $review_ids; do
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews/${id}/dismissals" \
            -f message="$DISMISS_BODY"
        done
